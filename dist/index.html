<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <title>Mavuno Church</title>
    <meta name="description" content="A people. A purpose. A place to belong. Join the Mavuno Church community." />

    <!-- ── PWA manifest & theme ─────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F5821F" />

    <!-- ── Apple PWA meta ───────────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mavuno" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- ── Open Graph / Social ──────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mavuno Church" />
    <meta property="og:description" content="A people. A purpose. A place to belong." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mavuno Church" />
    <meta name="twitter:description" content="A people. A purpose. A place to belong." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- ── Base layout reset (react-native-web) ─────────────────────────── -->
    <style id="expo-reset">
      @font-face {
        font-family: 'Ionicons';
        src: url('https://cdn.jsdelivr.net/npm/@expo/vector-icons@14.0.0/build/vendor/react-native-vector-icons/Fonts/Ionicons.ttf') format('truetype');
      }
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: #FAFAFC; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>

    <!-- ── Install prompt styles ────────────────────────────────────────── -->
    <style>
      #pwa-install-toast {
        display: none;
        position: fixed;
        bottom: 96px; /* above tab bar */
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #1E1E1E 0%, #2A2A2A 100%);
        border: 1px solid rgba(245, 130, 31, 0.4);
        border-radius: 16px;
        padding: 14px 20px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(245,130,31,0.1);
        z-index: 99998;
        max-width: 340px;
        width: calc(100% - 48px);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #pwa-install-toast.hidden {
        animation: slideDown 0.25s ease-in both;
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateX(-50%) translateY(20px); }
        to   { opacity: 1; transform: translateX(-50%) translateY(0); }
      }
      @keyframes slideDown {
        from { opacity: 1; transform: translateX(-50%) translateY(0); }
        to   { opacity: 0; transform: translateX(-50%) translateY(20px); }
      }
      #pwa-install-toast .toast-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #pwa-install-toast .toast-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        flex-shrink: 0;
        object-fit: contain;
        background: #F5821F;
      }
      #pwa-install-toast .toast-text {
        flex: 1;
        min-width: 0;
      }
      #pwa-install-toast .toast-title {
        color: #FFFFFF;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.2;
        margin: 0 0 2px;
      }
      #pwa-install-toast .toast-sub {
        color: rgba(255,255,255,0.55);
        font-size: 12px;
        margin: 0;
      }
      #pwa-install-toast .toast-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      #pwa-install-btn {
        flex: 1;
        background: #F5821F;
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      #pwa-install-btn:hover { opacity: 0.85; }
      #pwa-dismiss-btn {
        background: transparent;
        color: rgba(255,255,255,0.4);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        cursor: pointer;
        transition: color 0.15s;
      }
      #pwa-dismiss-btn:hover { color: rgba(255,255,255,0.7); }
    </style>
  </head>

  <body>
    <!-- Global JavaScript Error Handler -->
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.warn('[App Error]', message, source, lineno, colno, error);
        return false;
      };
      window.onunhandledrejection = function(event) {
        console.warn('[App Rejection]', event.reason);
      };
    </script>

    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- App root -->
    <div id="root"></div>

    <!-- ── PWA Install Toast ─────────────────────────────────────────────── -->
    <div id="pwa-install-toast" role="dialog" aria-label="Install Mavuno Church app">
      <div class="toast-row">
        <img src="/icon-192.png" alt="Mavuno" class="toast-icon" />
        <div class="toast-text">
          <p class="toast-title">Install Mavuno Church</p>
          <p class="toast-sub">Add to your home screen for quick access</p>
        </div>
      </div>
      <div class="toast-actions">
        <button id="pwa-install-btn">Install App</button>
        <button id="pwa-dismiss-btn">Not now</button>
      </div>
    </div>

    <!-- ── Service Worker + Install Prompt ──────────────────────────────── -->
    <script>
      (function () {
        // --- Install prompt ---
        var deferredPrompt = null;
        var toast = document.getElementById('pwa-install-toast');
        var installBtn = document.getElementById('pwa-install-btn');
        var dismissBtn = document.getElementById('pwa-dismiss-btn');
        var DISMISSED_KEY = 'mavuno_pwa_prompt_dismissed';
        var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
        var isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

        function wasDismissed() {
          try { return sessionStorage.getItem(DISMISSED_KEY) === '1'; } catch (_) { return false; }
        }

        function showToast(message, installable) {
          if (!toast || wasDismissed() || isStandalone || !isMobile) return;
          var subtitle = toast.querySelector('.toast-sub');
          if (subtitle) subtitle.textContent = message;
          installBtn.textContent = installable ? 'Install App' : 'How to install';
          toast.style.display = 'block';
        }

        function hideToast() {
          toast.classList.add('hidden');
          setTimeout(function () { toast.style.display = 'none'; toast.classList.remove('hidden'); }, 300);
        }

        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferredPrompt = e;
          setTimeout(function () { showToast('Add Mavuno to your home screen for quick access', true); }, 1200);
        });

        installBtn.addEventListener('click', function () {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function (choice) {
              console.log('[PWA] Install choice:', choice.outcome);
              deferredPrompt = null;
              hideToast();
            });
            return;
          }
          if (isIOS) {
            showToast('Tap Share, then choose “Add to Home Screen”', false);
          } else {
            showToast('Open your browser menu and choose “Add to Home screen”', false);
          }
        });

        dismissBtn.addEventListener('click', function () {
          hideToast();
          try { sessionStorage.setItem(DISMISSED_KEY, '1'); } catch (_) {}
        });

        window.addEventListener('appinstalled', function () {
          console.log('[PWA] App installed successfully');
          hideToast();
          deferredPrompt = null;
        });

        window.addEventListener('load', function () {
          setTimeout(function () {
            if (!deferredPrompt) {
              showToast(isIOS ? 'Tap Share, then choose “Add to Home Screen”' : 'Open your browser menu and choose “Add to Home screen”', false);
            }
          }, 1600);
        });

        // --- Service Worker ---
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/service-worker.js')
              .then(function (reg) {
                console.log('[PWA] Service Worker registered, scope:', reg.scope);
              })
              .catch(function (err) {
                console.error('[PWA] Service Worker registration failed:', err);
              });
          });
        }
      })();
    </script>
  <script src="/_expo/static/js/web/AppEntry-3e1b201b2c08c24872623df00d18eb0a.js" defer></script>
</body>
</html>
