<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <!-- Solid background for standard/maskable PWA icon support -->
  <rect width="140" height="140" fill="#0A0A0A" />
  
  <!-- Outer ring arc: orange -->
  <circle
    cx="70"
    cy="70"
    r="54"
    stroke="#F5821F"
    stroke-width="4"
    fill="none"
    stroke-dasharray="265.2 340"
    stroke-linecap="round"
    transform="rotate(-100 70 70)"
  />
  
  <!-- Inner ring arc: gold -->
  <circle
    cx="70"
    cy="70"
    r="46"
    stroke="#C99A3C"
    stroke-width="3"
    fill="none"
    stroke-dasharray="238 340"
    stroke-linecap="round"
    transform="rotate(80 70 70)"
  />
  
  <!-- Brush-style M: white -->
  <path
    d="M46 92 L46 48 L70 78 L94 48 L94 92"
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
